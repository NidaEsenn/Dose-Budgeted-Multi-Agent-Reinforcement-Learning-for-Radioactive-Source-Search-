[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radsearch"
version = "0.1.0"
description = "Dose-budgeted multi-agent reinforcement learning for radioactive source search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nida Esen"}]
dependencies = ["numpy", "scipy", "numba", "torch", "pettingzoo", "gymnasium", "hydra-core",
                "omegaconf", "matplotlib", "pyyaml", "rliable"]

[project.optional-dependencies]
dev = ["pytest", "wandb", "pillow"]
sim3d = ["mujoco>=3.1", "pillow"]

[tool.setuptools.packages.find]
include = ["radsearch*"]

[tool.setuptools.package-data]
radsearch = ["physics_constants.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
