# Single source of truth for every physical constant used by the simulator
# and by the particle-filter likelihood (FR-PHY-07). Every value carries its
# source. Values marked VERIFY are listed in docs/OPEN_ITEMS.md.
#
# Units: distances in metres, activity in GBq inside the dose model,
# Bq inside the detector model, dose in Gy (Sv ~= Gy for gamma, AS-4).

isotopes:
  Co-60:
    # 0.351 mSv m^2 / (GBq h)  -> Gy m^2 / (GBq h)
    gamma_constant: 3.51e-4
    gamma_constant_source: "IAEA (1992), cited in Supian (2005), Sains Malaysiana 34(1) 41-43"
    photon_energy_MeV: 1.25          # mean of 1.173 and 1.332 MeV lines
    photons_per_decay: 2.0           # two cascade gammas, each ~0.9999
    photons_per_decay_source: "NNDC NuDat 3, Co-60 decay radiation"
    # Air linear attenuation at 1.25 MeV: mu/rho = 0.05687 cm^2/g (NIST XCOM),
    # rho_air = 1.205e-3 g/cm^3 -> 6.853e-5 cm^-1 -> 6.853e-3 m^-1. VERIFY
    mu_air_per_m: 6.853e-3
    mu_air_source: "NIST XCOM (air, dry, near sea level), 1.25 MeV; VERIFY"
    # Concrete (ordinary, rho 2.30 g/cm^3) and iron (rho 7.874 g/cm^3), 1.25 MeV.
    mu_material_per_m:
      concrete: 13.36   # 0.05807 cm^2/g * 2.30 g/cm^3 = 0.1336 cm^-1. VERIFY
      steel: 42.13      # 0.05350 cm^2/g * 7.874 g/cm^3 = 0.4213 cm^-1. VERIFY
      equipment: 2.107  # steel at 5 % fill fraction (hollow cabinets). Design choice
    mu_material_source: "NIST XCOM total attenuation with coherent scattering; VERIFY"
  Cs-137:
    # 0.089 mGy/h per GBq at 1 m -> Gy m^2 / (GBq h)
    gamma_constant: 8.9e-5
    gamma_constant_source: "IAEA (1988) The Radiological Accident in Goiania, Table I"
    photon_energy_MeV: 0.662
    photons_per_decay: 0.851         # 662 keV via Ba-137m
    photons_per_decay_source: "NNDC NuDat 3, Cs-137 decay radiation"
    # 9.076e-5 cm^-1 = 9.076e-3 m^-1
    mu_air_per_m: 9.076e-3
    mu_air_source: "Son et al. (2025), from Wright et al. (2021)"
    mu_material_per_m:
      concrete: 17.85   # 0.07760 cm^2/g * 2.30 g/cm^3 (log-log interp. 0.6/0.8 MeV). VERIFY
      steel: 57.87      # 0.07350 cm^2/g * 7.874 g/cm^3. VERIFY
      equipment: 2.894  # steel at 5 % fill fraction. Design choice
    mu_material_source: "NIST XCOM total attenuation with coherent scattering; VERIFY"

detector:
  # Expected counts (FR-PHY-03, Wright et al. 2021 / Son et al. 2025):
  #   lambda = C * [1 - d / sqrt(r^2 + m d + d^2)] * exp(-mu_air d) * T_wall + b * t
  #   C = 0.5 * A[Bq] * photons_per_decay * intrinsic_efficiency * t_dwell
  # d: source-detector distance, r: detector radius, m: empirical fit term
  # (m = 0 gives the exact solid-angle fraction of a disk detector).
  # Defaults describe a low-sensitivity probe of the kind carried into
  # high-dose areas; a large NaI crystal would be saturated at TBq activity.
  radius_m: 0.005
  radius_source: "Design choice (small GM / CZT probe); VERIFY against deployed hardware"
  intrinsic_efficiency: 0.01
  intrinsic_efficiency_source: "Design choice; tuned so counts stay below ~1e7 per dwell"
  fit_m: 0.0
  fit_m_source: "Wright et al. (2021) fit parameter; 0 = pure solid angle. VERIFY"
  background_cps: 1.0
  background_source: "Design choice: small relative to source (Section 9)"
  dead_time_s: 0.0               # FR-PHY-08 (Could); 0 disables the model
  height_m: 0.3
  height_source: "Design choice: detector 0.3 m above the floor-plane source; removes the r -> 0 singularity"

robot:
  lifetime_tid_Gy: 120.0
  lifetime_tid_source: "West et al. (2022), citing Nagatani et al. (2011)"
